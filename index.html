
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tsan Aung's Pages</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-alt: #f5f5f7;
    --text: #1d1d1f;
    --body-text: #3a3a3e;
    --muted: #86868b;
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --border: rgba(0, 0, 0, 0.08);
    --card-shadow: rgba(0, 0, 0, 0.09);
    --tag-hover: #ececed;
    --header-bg: rgba(255, 255, 255, 0.72);
    --code-bg: #1d1d1f;
    --code-text: #f5f5f7;
    --radius: 18px;
  }
  [data-theme="dark"] {
    --bg: #000000;
    --bg-alt: #1d1d1f;
    --text: #f5f5f7;
    --body-text: #c7c7cc;
    --muted: #86868b;
    --accent: #2997ff;
    --accent-hover: #0077ed;
    --border: rgba(255, 255, 255, 0.12);
    --card-shadow: rgba(0, 0, 0, 0.5);
    --tag-hover: #2c2c2e;
    --header-bg: rgba(0, 0, 0, 0.72);
    --code-bg: #1d1d1f;
    --code-text: #f5f5f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.6; letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    transition: background 0.4s ease, color 0.4s ease;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    position: sticky; top: 0; z-index: 100;
    background: var(--header-bg);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .nav { max-width: 1020px; margin: 0 auto; padding: 0.8rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-weight: 600; font-size: 1.1rem; color: var(--text); letter-spacing: -0.02em; }
  nav { display: flex; gap: 2rem; align-items: center; }
  nav a { color: var(--muted); font-size: 0.85rem; transition: color 0.25s ease; }
  nav a:hover { color: var(--text); text-decoration: none; }
  nav a.active { color: var(--text); }

  main { max-width: 1020px; margin: 0 auto; padding: 0 1.5rem 4rem; }

  .hero { padding: 7rem 0 4rem; text-align: center; }
  .hero h1 {
    font-size: clamp(2.6rem, 6vw, 4.2rem);
    font-weight: 700; letter-spacing: -0.03em; line-height: 1.08;
    animation: fadeUp 0.9s ease both;
  }
  .hero h1 em { font-style: normal;
    background: linear-gradient(90deg, var(--accent), #42a5f5);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lead { color: var(--muted); font-size: clamp(1.05rem, 2vw, 1.3rem); margin: 1.4rem auto 2.2rem; max-width: 40rem; }
  .hero .lead { animation: fadeUp 0.9s ease 0.2s both; }

  h2.section-title {
    font-size: clamp(1.6rem, 3vw, 2.4rem);
    font-weight: 700; letter-spacing: -0.02em;
    margin: 4.5rem 0 1.6rem; text-align: center;
  }
  .section-sub { color: var(--muted); text-align: center; margin: -1rem auto 2.2rem; max-width: 36rem; }

  .btn {
    display: inline-block; background: var(--accent); color: #fff;
    padding: 0.75rem 1.6rem; border-radius: 980px; font-weight: 500;
    font-size: 0.95rem; transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
  }
  .btn:hover { text-decoration: none; background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 113, 227, 0.25); }
  .btn.ghost { background: transparent; color: var(--accent); border: none; }
  .btn.ghost::after { content: " ›"; transition: transform 0.2s ease; display: inline-block; }
  .btn.ghost:hover { background: transparent; box-shadow: none; transform: none; }
  .btn.ghost:hover::after { transform: translateX(4px); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.4rem; }
  .card {
    background: var(--bg-alt); border-radius: var(--radius);
    padding: 2rem; text-align: left; color: var(--text);
    transition: transform 0.35s cubic-bezier(0.25, 0.1, 0.25, 1), box-shadow 0.35s ease;
    will-change: transform;
  }
  .card:hover { text-decoration: none; transform: scale(1.03); box-shadow: 0 16px 40px var(--card-shadow); }
  .card h3 { font-size: 1.15rem; font-weight: 600; margin-bottom: 0.45rem; letter-spacing: -0.01em; }
  .card p { color: var(--muted); font-size: 0.92rem; }
  .card .price { color: var(--accent); font-weight: 500; margin-top: 0.9rem; display: block; font-size: 0.9rem; }
  .card .icon { font-size: 1.8rem; display: block; margin-bottom: 0.8rem; }

  .tag {
    display: inline-block; background: var(--bg-alt); border-radius: 980px;
    padding: 0.35rem 0.95rem; font-size: 0.85rem; color: var(--text);
    margin: 0.3rem 0.25rem 0 0; transition: transform 0.25s ease, background 0.25s ease;
  }
  .tag:hover { transform: translateY(-2px); background: var(--tag-hover); }

  .theme-toggle {
    background: none; border: none; cursor: pointer;
    font-size: 1.05rem; line-height: 1; padding: 0.3rem;
    border-radius: 50%; transition: transform 0.3s ease, background 0.3s ease;
  }
  .theme-toggle:hover { transform: rotate(30deg) scale(1.15); background: var(--bg-alt); }

  .reveal { opacity: 0; transform: translateY(28px); }
  .reveal.visible { animation: fadeUp 0.8s cubic-bezier(0.25, 0.1, 0.25, 1) both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .post-meta { color: var(--muted); font-size: 0.85rem; }
  .back { display: inline-block; margin-top: 2.5rem; }

  .prose { max-width: 700px; margin: 0 auto; padding-top: 3rem; }
  .prose h1 { font-size: clamp(1.9rem, 4vw, 2.8rem); letter-spacing: -0.02em; line-height: 1.15; font-weight: 700; }
  .prose h2 { font-size: 1.6rem; margin: 2.2rem 0 0.6rem; letter-spacing: -0.01em; }
  .prose p { margin: 1rem 0; color: var(--body-text); }
  .prose ul { margin: 1rem 0 1rem 1.4rem; color: var(--body-text); }
  .prose code { background: var(--bg-alt); padding: 0.15rem 0.45rem; border-radius: 6px; font-size: 0.88em; font-family: "SF Mono", ui-monospace, Menlo, monospace; }
  .prose pre { background: var(--code-bg); color: var(--code-text); padding: 1.3rem; border-radius: var(--radius); overflow-x: auto; margin: 1.4rem 0; }
  .prose pre code { background: none; padding: 0; color: inherit; }
  .prose blockquote { border-left: 3px solid var(--accent); padding-left: 1.2rem; color: var(--muted); margin: 1.4rem 0; }

  footer { border-top: 1px solid var(--border); background: var(--bg-alt); }
  footer .inner { max-width: 1020px; margin: 0 auto; padding: 1.6rem; color: var(--muted); font-size: 0.82rem; text-align: center; }
  @media (max-width: 600px) { .hero { padding-top: 4rem; } nav { gap: 1.1rem; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<header>
  <div class="nav">
    <a class="logo" href="#/">Tsan&nbsp;Aung</a>
    <nav>
      <a href="#/services" data-route="services">Services</a>
      <a href="#/blog" data-route="blog">Blog</a>
      <a href="#/#contact" data-route="contact">Contact</a>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
    </nav>
  </div>
</header>
<main id="app"></main>
<footer><div class="inner">© 2026 Tsan Aung · Handcrafted with HTML / CSS / JavaScript · <a href="mailto:myanmar@post.com">myanmar@post.com</a></div></footer>

<script>
/* ---------- theme — default/fallback = dark ---------- */
const root = document.documentElement;
const toggleBtn = document.getElementById("themeToggle");
function applyTheme(theme) {
  root.setAttribute("data-theme", theme);
  if (toggleBtn) toggleBtn.textContent = theme === "dark" ? "☀️" : "🌙";
}
const savedTheme = localStorage.getItem("theme");
if (savedTheme) applyTheme(savedTheme);
else applyTheme("dark");
if (toggleBtn) {
  toggleBtn.addEventListener("click", function () {
    const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    localStorage.setItem("theme", next);
  });
}

/* ---------- SITE DATA ---------- */
const SERVICES = [
  { icon: "🌐", title: "Web Development", desc: "Responsive, fast-loading websites built with modern HTML, CSS and JavaScript.", price: "from $150" },
  { icon: "📱", title: "Android Apps", desc: "Native Android applications in Java/Kotlin, published to Play Store.", price: "from $300" },
  { icon: "🎨", title: "WordPress Themes", desc: "Custom themes & plugins, performance tuning and security hardening.", price: "from $120" },
  { icon: "🔧", title: "Maintenance & Support", desc: "Ongoing updates, backups, bug fixes and Linux server administration.", price: "monthly plans" },
];
const SKILLS = ["PHP","WordPress","JavaScript","Node.js","Android (Java/Kotlin)","MySQL","Linux","Git","HTML/CSS"];
const PROJECTS = [
  { title: "MMITC", desc: "WordPress themes & plugins for mmitcorner.com.", tags: ["WordPress","PHP"] },
  { title: "RangoonTech", desc: "Myanmar tech community website.", tags: ["Web","Community"] },
  { title: "LovelyMyanmar", desc: "Android application for Myanmar users.", tags: ["Android","Java"] },
];

/* ---------- markdown renderer ---------- */
function renderMarkdown(md) {
  let html = md.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const codeBlocks = [];
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function (_, lang, code) {
    codeBlocks.push("<pre><code>" + code.trim() + "</code></pre>");
    return "\u0000" + (codeBlocks.length - 1) + "\u0000";
  });
  html = html
    .replace(/^### (.*)$/gm, "<h3>$1</h3>")
    .replace(/^## (.*)$/gm, "<h2>$1</h2>")
    .replace(/^# (.*)$/gm, "<h1>$1</h1>")
    .replace(/^> (.*)$/gm, "<blockquote>$1</blockquote>")
    .replace(/^- (.*)$/gm, "<li>$1</li>")
    .replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, "<ul>$1</ul>")
    .replace(/^\d+\. (.*)$/gm, "<li>$1</li>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.+?)\*/g, "<em>$1</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  html = html.split(/\n{2,}/).map(function (block) {
    if (/^<(h\d|ul|pre|blockquote)/.test(block.trim())) return block.trim();
    return "<p>" + block.replace(/\n/g, "<br/>").trim() + "</p>";
  }).join("\n");
  html = html.replace(/\u0000(\d+)\u0000/g, function (_, i) { return codeBlocks[+i]; });
  return html;
}

/* ---------- views ---------- */
function viewHome() {
  return `
    <section class="hero">
      <h1>Hi, I'm <em>Tsan Aung</em></h1>
      <p class="lead">Freelance Web Developer &amp; Android Application Developer based in Myanmar.
      I build fast, reliable websites, WordPress themes and mobile apps.</p>
      <a class="btn" href="#/services">My Services</a>
      &nbsp;&nbsp;<a class="btn ghost" href="#/blog">Read the blog</a>
    </section>
    <section id="skills">
      <h2 class="section-title reveal">Skills.</h2>
      <p class="section-sub reveal">Technologies I work with every day.</p>
      <div class="reveal">${SKILLS.map(s => `<span class="tag">${s}</span>`).join("")}</div>
    </section>
    <section id="projects">
      <h2 class="section-title reveal">Projects.</h2>
      <p class="section-sub reveal">A selection of things I've built.</p>
      <div class="grid">
        ${PROJECTS.map(p => `
          <div class="card reveal">
            <h3>${p.title}</h3><p>${p.desc}</p>
            <div style="margin-top:.8rem">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
          </div>`).join("")}
      </div>
    </section>
    <section id="contact">
      <h2 class="section-title reveal">Contact.</h2>
      <p class="section-sub reveal">Project တစ်ခုလုပ်ချင်ရင် ဆက်သွယ်လို့ရပါတယ်။</p>
      <p style="text-align:center" class="reveal">
        <a class="btn" href="mailto:myanmar@post.com">📧 myanmar@post.com</a>
      </p>
    </section>`;
}

function viewServices() {
  return `
    <section class="hero">
      <h1>Services.</h1>
      <p class="lead">Development, customization and support — ကိုယ့် project အတွက် လိုအပ်တာ အားလုံးပါ။</p>
    </section>
    <div class="grid">
      ${SERVICES.map(s => `
        <div class="card reveal">
          <span class="icon">${s.icon}</span>
          <h3>${s.title}</h3>
          <p>${s.desc}</p>
          <span class="price">${s.price}</span>
        </div>`).join("")}
    </div>
    <section id="contact">
      <h2 class="section-title reveal">Get a quote.</h2>
      <p style="text-align:center" class="reveal">
        <a class="btn" href="mailto:myanmar@post.com">Email me</a>
      </p>
    </section>`;
}

async function viewBlog() {
  const posts = await loadPosts();
  return `
    <section class="hero">
      <h1>Blog.</h1>
      <p class="lead">Notes on web development, Android, WordPress and Linux.</p>
    </section>
    <div class="grid">
      ${posts.map(p => `
        <a class="card reveal" href="#/blog/${p.slug}">
          <h3>${p.title}</h3>
          <p class="post-meta">${p.date}${p.tags ? " · " + p.tags.map(t => "#" + t).join(" ") : ""}</p>
        </a>`).join("")}
    </div>`;
}

async function viewPost(slug) {
  const posts = await loadPosts();
  const post = posts.find(p => p.slug === slug);
  if (!post) return `<section class="hero"><h1>404</h1><p class="lead">Post not found.</p></section>`;
  return `
    <article class="prose">
      <h1>${post.title}</h1>
      <p class="post-meta" style="margin-top:.6rem">${post.date}${post.tags ? " · " + post.tags.map(t => "#" + t).join(" ") : ""}</p>
      <hr style="border:none;border-top:1px solid var(--border);margin:1.6rem 0;"/>
      ${renderMarkdown(post.md)}
      <a class="back" href="#/blog">‹ All posts</a>
    </article>`;
}

/* ---------- load posts from posts/index.json (GitHub Pages) ---------- */
let POSTS_CACHE = null;
async function loadPosts() {
  if (POSTS_CACHE) return POSTS_CACHE;
  try {
    const res = await fetch("posts/index.json");
    if (!res.ok) throw new Error("no index.json");
    const index = await res.json();
    POSTS_CACHE = await Promise.all(index.map(async function (meta) {
      const r = await fetch(meta.file);
      return { slug: meta.slug, title: meta.title, date: meta.date, tags: meta.tags, md: await r.text() };
    }));
  } catch (e) {
    POSTS_CACHE = []; /* posts/index.json မရှိရင် blog ဖွင့်မပြ */
  }
  return POSTS_CACHE;
}

/* ---------- scroll reveal ---------- */
const observer = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    if (entry.isIntersecting) {
      entry.target.classList.add("visible");
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.12 });
function activateReveals() {
  document.querySelectorAll(".reveal:not(.visible)").forEach(function (el) { observer.observe(el); });
}

/* ---------- router ---------- */
const app = document.getElementById("app");
async function router() {
  const hash = location.hash.replace(/^#/, "") || "/";
  const parts = hash.split("/").filter(Boolean);
  const route = parts[0] || "home";
  let html;
  if (route === "services") html = viewServices();
  else if (route === "blog" && parts[1]) html = await viewPost(parts[1]);
  else if (route === "blog") html = await viewBlog();
  else html = viewHome();
  app.innerHTML = html;
  document.querySelectorAll("nav a").forEach(function (a) {
    a.classList.toggle("active", a.dataset.route === (route === "blog" && parts[1] ? "blog" : route));
  });
  activateReveals();
  if (!hash.includes("#contact")) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", router);
router();
</script>
</body>
</html>

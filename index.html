<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tsan Aung's Page</title>
<meta name="description" content="Tsan Aung's Page — portfolio, blog, services & products." />
<style>
  /* ---------- Design tokens (Apple-style minimalist, dark by default) ---------- */
  :root {
    --bg: #0a0a0c;
    --bg-elev: #141417;
    --bg-elev-2: #1c1c21;
    --text: #f5f5f7;
    --text-dim: #a1a1a6;
    --text-faint: #6e6e73;
    --accent: #2997ff;
    --accent-soft: rgba(41, 151, 255, 0.14);
    --border: rgba(255, 255, 255, 0.1);
    --radius: 18px;
    --nav-h: 64px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  [data-theme="light"] {
    --bg: #ffffff;
    --bg-elev: #f5f5f7;
    --bg-elev-2: #ebebed;
    --text: #1d1d1f;
    --text-dim: #515154;
    --text-faint: #86868b;
    --border: rgba(0, 0, 0, 0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
    transition: background 0.4s var(--ease), color 0.4s var(--ease);
  }
  ::selection { background: var(--accent-soft); }
  a { color: var(--accent); text-decoration: none; }
  img { max-width: 100%; }

  /* ---------- Layout ---------- */
  .container { max-width: 980px; margin: 0 auto; padding: 0 24px; }

  /* ---------- Nav ---------- */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: var(--nav-h);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    max-width: 980px; margin: 0 auto; padding: 0 24px;
    height: 100%; display: flex; align-items: center; justify-content: space-between;
  }
  .logo {
    font-weight: 700; font-size: 17px; letter-spacing: -0.02em; color: var(--text);
    display: flex; align-items: center; gap: 10px;
  }
  .logo:hover { opacity: 0.7; }
  .nav-links { display: flex; gap: 28px; align-items: center; }
  .nav-links a {
    color: var(--text-dim); font-size: 14px; font-weight: 500;
    transition: color 0.25s var(--ease);
  }
  .nav-links a:hover, .nav-links a.active { color: var(--text); }
  .theme-btn {
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim);
    width: 34px; height: 34px; border-radius: 999px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.3s var(--ease), color 0.3s;
  }
  .theme-btn:hover { transform: scale(1.1); color: var(--text); }

  /* ---------- Hero ---------- */
  header.hero {
    min-height: 92vh; display: flex; align-items: center;
    position: relative; overflow: hidden;
  }
  .hero-glow {
    position: absolute; width: 640px; height: 640px; border-radius: 50%;
    background: radial-gradient(circle, rgba(41,151,255,0.18), transparent 65%);
    top: -180px; right: -140px; pointer-events: none;
    animation: glowFloat 12s ease-in-out infinite alternate;
  }
  @keyframes glowFloat {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(-60px, 50px) scale(1.15); }
  }
  .hero-content { position: relative; }
  .eyebrow {
    color: var(--accent); font-size: 13px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 18px;
  }
  h1.hero-title {
    font-size: clamp(44px, 8vw, 84px);
    font-weight: 800; letter-spacing: -0.035em; line-height: 1.05;
    background: linear-gradient(120deg, var(--text) 40%, var(--accent));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero-sub {
    margin-top: 22px; font-size: clamp(17px, 2.4vw, 22px);
    color: var(--text-dim); max-width: 560px; font-weight: 400;
  }
  .hero-cta { margin-top: 36px; display: flex; gap: 14px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; padding: 13px 26px;
    border-radius: 999px; font-size: 15px; font-weight: 600;
    transition: transform 0.3s var(--ease), opacity 0.3s, box-shadow 0.3s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary {
    background: var(--accent); color: #fff;
    box-shadow: 0 8px 30px rgba(41, 151, 255, 0.35);
  }
  .btn-primary:hover { box-shadow: 0 12px 40px rgba(41, 151, 255, 0.5); }
  .btn-ghost { border: 1px solid var(--border); color: var(--text); background: var(--bg-elev); }
  .btn-ghost:hover { border-color: var(--text-faint); }

  /* ---------- Sections / pages ---------- */
  main { padding-top: var(--nav-h); min-height: 70vh; }
  .page { animation: pageIn 0.55s var(--ease) both; }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }
  section { padding: 96px 0; }
  .section-label {
    color: var(--accent); font-size: 13px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 10px;
  }
  h2.section-title {
    font-size: clamp(30px, 4.5vw, 48px); font-weight: 800;
    letter-spacing: -0.03em; line-height: 1.12; margin-bottom: 16px;
  }
  .section-sub { color: var(--text-dim); font-size: 18px; max-width: 560px; }

  /* ---------- Cards (posts / services / products) ---------- */
  .grid { display: grid; gap: 20px; margin-top: 44px; }
  .grid-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .grid-3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .card {
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px;
    color: var(--text);
    transition: transform 0.35s var(--ease), border-color 0.35s, background 0.35s;
    will-change: transform;
  }
  .card:hover { transform: translateY(-6px); border-color: rgba(41,151,255,0.45); }
  .card h3 { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
  .card h3 a { color: var(--text); }
  .card h3 a:hover { color: var(--accent); }
  .card p { color: var(--text-dim); font-size: 15px; }
  .card .meta { color: var(--text-faint); font-size: 12.5px; margin-bottom: 10px; }
  .card .tag {
    display: inline-block; font-size: 12px; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); padding: 4px 12px; border-radius: 999px; margin-bottom: 14px;
  }
  .price { font-size: 22px; font-weight: 800; color: var(--text); margin-top: 14px; }

  /* ---------- Tags ---------- */
  .tag-chip {
    display: inline-block; font-size: 12px; font-weight: 600; color: var(--text-dim);
    background: var(--bg-elev-2); border: 1px solid var(--border);
    padding: 3px 12px; border-radius: 999px; margin: 4px 6px 0 0;
    transition: color 0.25s var(--ease), border-color 0.25s;
  }
  .article-tags .tag-chip { margin-top: 4px; }
  .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 32px; }
  .filter-btn {
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim);
    font-size: 13px; font-weight: 600; padding: 7px 18px; border-radius: 999px;
    cursor: pointer; transition: transform 0.25s var(--ease), color 0.25s, border-color 0.25s;
  }
  .filter-btn:hover { transform: translateY(-2px); color: var(--text); }
  .filter-btn.active {
    color: var(--accent); border-color: rgba(41,151,255,0.5); background: var(--accent-soft);
  }

  /* ---------- Markdown article ---------- */
  .article-head { padding: 72px 0 8px; }
  .article-head h1 {
    font-size: clamp(32px, 5vw, 52px); font-weight: 800; letter-spacing: -0.03em;
    line-height: 1.12; margin: 14px 0 18px;
  }
  .article-head .date { color: var(--text-faint); font-size: 14px; }
  .prose { max-width: 720px; padding-bottom: 96px; }
  .prose h1, .prose h2, .prose h3 { letter-spacing: -0.02em; margin: 1.6em 0 0.5em; line-height: 1.25; }
  .prose h2 { font-size: 28px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .prose h3 { font-size: 21px; }
  .prose p, .prose ul, .prose ol { color: var(--text-dim); margin: 1em 0; }
  .prose strong { color: var(--text); }
  .prose code {
    background: var(--bg-elev-2); padding: 2px 7px; border-radius: 6px;
    font-size: 0.88em; font-family: "SF Mono", ui-monospace, Menlo, monospace;
  }
  .prose pre {
    background: var(--bg-elev-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; overflow-x: auto; margin: 1.4em 0;
  }
  .prose pre code { background: none; padding: 0; }
  .prose blockquote {
    border-left: 3px solid var(--accent); padding-left: 18px; margin: 1.4em 0;
    color: var(--text-dim); font-style: italic;
  }
  .prose img { border-radius: var(--radius); margin: 1.4em 0; }
  .back-link { display: inline-flex; align-items: center; gap: 8px; margin-top: 24px; font-weight: 600; }

  /* ---------- Footer ---------- */
  footer {
    border-top: 1px solid var(--border); padding: 40px 0 60px;
    color: var(--text-faint); font-size: 13.5px;
  }
  footer .nav-inner { justify-content: flex-start; gap: 24px; flex-wrap: wrap; }
  footer a { color: var(--text-faint); }
  footer a:hover { color: var(--text); }

  /* ---------- Reveal-on-scroll animation ---------- */
  .reveal { opacity: 0; transform: translateY(26px); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }
  .reveal.visible { opacity: 1; transform: none; }

  /* ---------- Mobile ---------- */
  @media (max-width: 640px) {
    .nav-links a.hide-sm { display: none; }
    section { padding: 64px 0; }
  }
</style>
</head>

<nav>
  <div class="nav-inner">
    <a class="logo" href="#/">✦ Tsan Aung</a>
    <div class="nav-links" id="navlinks">
      <a href="#/" data-route="/">Home</a>
      <a href="#/blog" data-route="/blog">Blog</a>
      <a href="#/services" data-route="/services">Services &amp; Products</a>
      <button class="theme-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>

  </div>

<main id="app"></main>

    <span>© <span id="year"></span> Tsan Aung · tsanaung.pages.dev</span>
    <a href="#/blog">Blog</a>

<script>
/* =========================================================
   Tiny portfolio SPA — hash router + markdown blog engine
   Blog posts: put .md files in /posts/ and list them in /posts/posts.json
   ========================================================= */

/* ---------- Theme (dark is the default) ---------- */
const themeBtn = document.getElementById("themeBtn");
const saved = localStorage.getItem("theme");
if (saved === "light") document.documentElement.setAttribute("data-theme", "light");
themeBtn.addEventListener("click", () => {
  const light = document.documentElement.getAttribute("data-theme") === "light";
  document.documentElement.setAttribute("data-theme", light ? "dark" : "light");
  localStorage.setItem("theme", light ? "dark" : "light");
});
document.getElementById("year").textContent = new Date().getFullYear();

/* ---------- Mini markdown parser (headings, lists, code, quotes, links, bold, italic, images) ---------- */
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inline(s) {
  return esc(s)
    .replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, '<img src="$2" alt="$1">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, '<a href="$2">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function md2html(md) {
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  let html = "", i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {                      // fenced code block
      let code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      i++;
      html += "<pre><code>" + code.map(esc).join("\n") + "</code></pre>";
    } else if (/^#{1,3}\s/.test(line)) {          // heading
      const m = line.match(/^(#{1,3})\s+(.*)/);
      html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; i++;
    } else if (/^>\s?/.test(line)) {              // blockquote
      let q = []; 
      while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ""));
      html += "<blockquote>" + inline(q.join(" ")) + "</blockquote>";
    } else if (/^\s*[-*]\s+/.test(line)) {        // unordered list
      let items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i]))
        items.push("<li>" + inline(lines[i++].replace(/^\s*[-*]\s+/, "")) + "</li>");
      html += "<ul>" + items.join("") + "</ul>";
    } else if (/^\s*\d+\.\s+/.test(line)) {       // ordered list
      let items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i]))
        items.push("<li>" + inline(lines[i++].replace(/^\s*\d+\.\s+/, "")) + "</li>");
      html += "<ol>" + items.join("") + "</ol>";
    } else if (line.trim() === "") { i++; }
    else {                                        // paragraph
      let p = [];
      while (i < lines.length && lines[i].trim() !== "" && !/^(#{1,3}\s|>|```|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i]))
        p.push(lines[i++]);
      html += "<p>" + inline(p.join(" ")) + "</p>";
    }
  }
  return html;
}

/* ---------- Content data ---------- */
const PROFILE = {
  name: "Tsan Aung",
  tagline: "I build clean, fast and delightful digital products.",
  about: "Developer & designer based in Myanmar. I love minimal interfaces, thoughtful typography and pixels that move beautifully."
};

const SERVICES = [
  { icon: "⌨️", title: "Web Development", desc: "Modern, responsive websites and web apps built with clean code and performance in mind.<br/><a href='https://t.me/staffcondor'>Chat with me</a>" },
  { icon: "🎨", title: "UI / UX Design", desc: "Minimalist, user-first interfaces designed to feel effortless on every screen size.<br/><a href='https://t.me/staffcondor'>Chat with me</a>" },
  { icon: "🚀", title: "Deployment & DevOps", desc: "Cloudflare Pages, CI/CD pipelines and performance optimization for production apps.<br/><a href='https://t.me/staffcondor'>Chat with me</a>" },
];

const PRODUCTS = [
  { title: ".Webp to .JPG Converter", desc: "A web converter to convert image format from .webp to jpg", price: "<a href='https://tsanaung.pages.dev/#/blog/webp_jpg_converter'>Free_OpenSource</a>" },
  { title: "Web to .DEB", desc: "A desktop application built with Electron to convert web applications into Debian package (.deb) installers for Linux distributions (such as Debian, Ubuntu, and Cutefish OS)", price: "<a href='https://tsanaung.pages.dev/#/blog/web2deb'>Free_OpenSource</a>" },
  { title: "Web to .EXE", desc: "Convert any Web Application or Website into a standalone Windows Desktop App (.exe) using Python, pywebview, and Microsoft Edge WebView2.", price: "<a href='https://tsanaung.pages.dev/#/blog/web2exe'>Free_OpenSource</a>" },
  { title: "Custom Project", desc: "Need something tailored? Let's talk about your idea.", price: "<a href='https://t.me/staffcondor'>Let's chat</a>" },
];

/* ---------- Page templates ---------- */
const app = document.getElementById("app");

function homePage() {
  return `
  <div class="page">
    <header class="hero">
      <div class="hero-glow"></div>
      <div class="container hero-content">
        <div class="eyebrow reveal">Portfolio</div>
        <h1 class="hero-title reveal">Hi, I'm ${PROFILE.name}.<br/>I craft digital experiences.</h1>
        <p class="hero-sub reveal">${PROFILE.tagline} ${PROFILE.about}</p>
        <div class="hero-cta reveal">
          <a class="btn btn-primary" href="#/services">View Services &amp; Products</a>
          <a class="btn btn-ghost" href="#/blog">Read the Blog</a>
        </div>
      </div>
    </header>

    <section class="container">
      <div class="reveal"><div class="section-label">What I do</div>
        <h2 class="section-title">Services</h2>
        <p class="section-sub">From idea to launch — design, code and deployment.</p>
      </div>
      <div class="grid grid-3">
        ${SERVICES.map(s => `
          <div class="card reveal">
            <div style="font-size:32px;margin-bottom:14px">${s.icon}</div>
            <h3>${s.title}</h3><p>${s.desc}</p>
          </div>`).join("")}
      </div>
      <div style="margin-top:32px" class="reveal">
        <a class="btn btn-ghost" href="#/services">All services &amp; products →</a>
      </div>
    </section>

    <section class="container" id="home-posts">
      <div class="reveal"><div class="section-label">Latest writing</div>
        <h2 class="section-title">From the Blog</h2>
      </div>
      <div class="grid grid-2" id="home-post-grid"></div>
    </section>
  </div>`;
}

function blogListPage(tag) {
  const tags = allTags();
  const posts = tag ? POSTS.filter(p => (p.tags || []).includes(tag)) : POSTS;
  return `
  <div class="page container">
    <section>
      <div class="section-label reveal">Blog${tag ? " · Tag" : ""}</div>
      <h2 class="section-title reveal">${tag ? "#" + tag : "Writing &amp; Notes"}</h2>
      <p class="section-sub reveal">All posts are plain markdown files inside <code>/posts/</code>.</p>
      <div class="filter-bar reveal">
        <a class="filter-btn${!tag ? " active" : ""}" href="#/blog">All</a>
        ${tags.map(t => `<a class="filter-btn${t === tag ? " active" : ""}" href="#/blog/tag/${encodeURIComponent(t)}">${t}</a>`).join("")}
      </div>
      <div class="grid grid-2" id="post-grid"></div>
    </section>
  </div>`;
}

function allTags() {
  const set = new Set();
  POSTS.forEach(p => (p.tags || []).forEach(t => set.add(t)));
  return [...set].sort();
}

function tagsHtml(p) {
  return (p.tags || []).map(t =>
    `<a class="tag-chip" href="#/blog/tag/${encodeURIComponent(t)}">#${t}</a>`).join("");
}

function articleShell(meta, bodyHtml) {
  return `
  <div class="page container">
    <div class="article-head">
      <a class="back-link" href="#/blog">← Back to blog</a>
      <h1>${meta.title}</h1>
      <div class="date">${meta.date || ""}${meta.author ? " · " + meta.author : ""}</div>
      ${meta.tags ? `<div class="article-tags" style="margin-top:12px">${tagsHtml(meta)}</div>` : ""}
    </div>
    <article class="prose">${bodyHtml}</article>
  </div>`;
}

function servicesPage() {
  return `
  <div class="page container">
    <section>
      <div class="section-label reveal">Offer</div>
      <h2 class="section-title reveal">Services</h2>
      <div class="grid grid-3">
        ${SERVICES.map(s => `
          <div class="card reveal">
            <div style="font-size:32px;margin-bottom:14px">${s.icon}</div>
            <h3>${s.title}</h3><p>${s.desc}</p>
          </div>`).join("")}
      </div>
    </section>
    <section>
      <div class="section-label reveal">Shop</div>
      <h2 class="section-title reveal">Products</h2>
      <div class="grid grid-3">
        ${PRODUCTS.map(p => `
          <div class="card reveal">
            <span class="tag">Product</span>
            <h3>${p.title}</h3><p>${p.desc}</p>
            <div class="price">${p.price}</div>
          </div>`).join("")}
      </div>
    </section>
  </div>`;
}

/* ---------- Render helpers ---------- */
function revealObserve() {
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); }
    });
  }, { threshold: 0.12 });
  document.querySelectorAll(".reveal:not(.visible)").forEach((el, idx) => {
    el.style.transitionDelay = Math.min(idx * 60, 400) + "ms";
    io.observe(el);
  });
}

function cardHtml(p) {
  return `
  <div class="card reveal">
    <div class="meta">${p.date || ""}</div>
    <h3><a href="#/blog/${p.slug}">${p.title}</a></h3>
    <p>${p.desc || ""}</p>
  </div>`;
}

/* ---------- Posts loading ----------
   posts.json format:
   [
     { "slug": "hello-world", "title": "Hello World", "date": "Nov 2026",
       "desc": "First post!", "tags": ["meta", "intro"] }
   ]
   Each entry maps to /posts/<slug>.md
------------------------------------*/
let POSTS = [];

async function loadPosts() {
  try {
    const res = await fetch("posts/posts.json");
    POSTS = await res.json();
  } catch (e) {
    POSTS = [];
  }
}

/* ---------- Router ---------- */
async function render() {
  const route = (location.hash || "#/") + "";
  window.scrollTo({ top: 0 });

  // active nav link (Blog stays active on tag/post routes)
  const routePath = route.replace(/^#/, "") || "/";
  document.querySelectorAll("#navlinks a").forEach(a => {
    a.classList.toggle("active",
      a.dataset.route === routePath ||
      (a.dataset.route === "/blog" && routePath.startsWith("/blog")));
  });

  if (route.startsWith("#/blog/tag/")) {
    const tag = decodeURIComponent(route.slice("#/blog/tag/".length).replace(/\/$/, ""));
    app.innerHTML = blogListPage(tag);
    const grid = document.getElementById("post-grid");
    const filtered = POSTS.filter(p => (p.tags || []).includes(tag));
    grid.innerHTML = filtered.map(cardHtml).join("") ||
      `<p class="section-sub">No posts tagged <strong>#${tag}</strong> yet.</p>`;
  } else if (route.startsWith("#/blog/")) {
    const slug = decodeURIComponent(route.slice("#/blog/".length).replace(/\/$/, ""));
    try {
      const res = await fetch("posts/" + slug + ".md");
      const raw = await res.text();
      const meta = POSTS.find(p => p.slug === slug) || { title: slug, date: "" };
      app.innerHTML = articleShell(meta, md2html(raw));
    } catch (e) {
      app.innerHTML = articleShell({ title: "Post not found", date: "" },
        "<p>Could not load <code>posts/" + esc(slug) + ".md</code>.</p>");
    }
  } else if (route === "#/blog") {
    app.innerHTML = blogListPage();
    const grid = document.getElementById("post-grid");
    grid.innerHTML = POSTS.map(cardHtml).join("") ||
      '<p class="section-sub">No posts yet. Add markdown files to <code>/posts/</code> and register them in <code>posts/posts.json</code>.</p>';
  } else if (route === "#/services") {
    app.innerHTML = servicesPage();
  } else {
    app.innerHTML = homePage();
    const grid = document.getElementById("home-post-grid");
    grid.innerHTML = POSTS.slice(0, 2).map(cardHtml).join("");
  }
  revealObserve();
}

window.addEventListener("hashchange", render);
loadPosts().then(render);
</script>
</body>
</html>
